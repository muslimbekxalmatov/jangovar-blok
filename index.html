```html
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Boxing Game</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#05050a;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

#game{
  width:420px;
  background:#111122;
  border-radius:20px;
  padding:20px;
  border:2px solid #222;
  box-shadow:0 0 30px rgba(0,0,0,.7);
}

.title{
  text-align:center;
  margin-bottom:20px;
}

.title h1{
  color:#ff3b30;
}

.status{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.card{
  flex:1;
  background:#19192d;
  padding:10px;
  border-radius:12px;
}

.name{
  font-size:14px;
  margin-bottom:8px;
  font-weight:bold;
}

.bar{
  width:100%;
  height:12px;
  background:#05050a;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:5px;
}

.fill{
  height:100%;
  width:100%;
  transition:.3s;
}

.hpP{
  background:linear-gradient(to right,#2ecc71,#27ae60);
}

.hpE{
  background:linear-gradient(to right,#ff3b30,#c0392b);
}

.st{
  background:linear-gradient(to right,#3498db,#2980b9);
}

.small{
  font-size:12px;
  color:#aaa;
}

.ring{
  position:relative;
  height:220px;
  background:linear-gradient(to bottom,#111,#222);
  border:4px solid #444;
  border-radius:15px;
  overflow:hidden;
  margin-bottom:20px;
}

.rope{
  position:absolute;
  width:100%;
  height:4px;
  background:red;
  top:50px;
  box-shadow:0 50px 0 white;
}

.boxer{
  position:absolute;
  bottom:20px;
  font-size:70px;
  transition:.2s;
}

#player{
  left:50px;
}

#enemy{
  right:50px;
  transform:scaleX(-1);
}

.attackP{
  animation:attackP .25s;
}

.attackE{
  animation:attackE .25s;
}

.hit{
  animation:hit .2s;
}

.block{
  transform:scale(.8);
  opacity:.6;
}

@keyframes attackP{
  0%{left:50px;}
  50%{left:120px;}
  100%{left:50px;}
}

@keyframes attackE{
  0%{right:50px;}
  50%{right:120px;}
  100%{right:50px;}
}

@keyframes hit{
  0%{transform:translateX(0);}
  25%{transform:translateX(-10px);}
  50%{transform:translateX(10px);}
  100%{transform:translateX(0);}
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

button{
  border:none;
  padding:15px;
  border-radius:12px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
}

.attackBtn{
  background:#ff3b30;
}

.blockBtn{
  background:#3498db;
}

.log{
  background:#08080f;
  border:1px solid #222;
  padding:10px;
  border-radius:10px;
  height:70px;
  overflow:auto;
  color:#ccc;
  font-size:14px;
}

.damage{
  position:absolute;
  top:40px;
  left:45%;
  font-size:30px;
  font-weight:bold;
  color:yellow;
  display:none;
  animation:pop .5s;
}

@keyframes pop{
  0%{
    transform:translateY(0) scale(.5);
    opacity:1;
  }

  100%{
    transform:translateY(-40px) scale(1.3);
    opacity:0;
  }
}

</style>
</head>

<body>

<div id="game">

  <div class="title">
    <h1>🥊 BOXING CHAMP</h1>
    <p>Realistic Fight Simulator</p>
  </div>

  <div class="status">

    <div class="card">
      <div class="name">SIZ</div>

      <div class="bar">
        <div id="pHP" class="fill hpP"></div>
      </div>

      <div class="bar" style="height:6px;">
        <div id="pST" class="fill st"></div>
      </div>

      <div class="small" id="pText">
        STAMINA 100%
      </div>
    </div>

    <div class="card">
      <div class="name">BOT</div>

      <div class="bar">
        <div id="eHP" class="fill hpE"></div>
      </div>

      <div class="bar" style="height:6px;">
        <div id="eST" class="fill st"></div>
      </div>

      <div class="small" id="eText">
        STAMINA 100%
      </div>
    </div>

  </div>

  <div class="ring">

    <div class="rope"></div>

    <div id="damage" class="damage">
      -20
    </div>

    <div id="player" class="boxer">
      🥊
    </div>

    <div id="enemy" class="boxer">
      🤖
    </div>

  </div>

  <div class="controls">
    <button class="attackBtn" onclick="fight('attack')">
      🥊 ZARBA
    </button>

    <button class="blockBtn" onclick="fight('block')">
      🛡️ BLOK
    </button>
  </div>

  <div id="log" class="log">
    Jang boshlandi!
  </div>

</div>

<script>

let playerHP = 100;
let enemyHP = 100;

let playerST = 100;
let enemyST = 100;

let busy = false;

function updateUI(){

  document.getElementById("pHP").style.width =
    playerHP + "%";

  document.getElementById("eHP").style.width =
    enemyHP + "%";

  document.getElementById("pST").style.width =
    playerST + "%";

  document.getElementById("eST").style.width =
    enemyST + "%";

  document.getElementById("pText").innerText =
    "STAMINA " + Math.floor(playerST) + "%";

  document.getElementById("eText").innerText =
    "STAMINA " + Math.floor(enemyST) + "%";
}

function popup(txt){

  let d = document.getElementById("damage");

  d.innerText = txt;

  d.style.display = "block";

  setTimeout(()=>{
    d.style.display = "none";
  },500);
}

function fight(action){

  if(busy) return;

  if(playerHP <= 0 || enemyHP <= 0) return;

  busy = true;

  let enemyAction;

  if(enemyST < 30){
    enemyAction = Math.random() < 0.7
      ? "block"
      : "attack";
  }else{
    enemyAction = Math.random() < 0.5
      ? "attack"
      : "block";
  }

  let p = document.getElementById("player");
  let e = document.getElementById("enemy");

  p.className = "boxer";
  e.className = "boxer";

  let text = "";

  // PLAYER
  if(action === "attack"){

    p.classList.add("attackP");

    playerST -= 15;

    if(enemyAction === "block"){

      e.classList.add("block");

      text += "Bot zarbani blok qildi<br>";

    }else{

      let dmg =
        Math.floor(Math.random()*15)+10;

      if(playerST < 30){
        dmg -= 5;
      }

      enemyHP -= dmg;

      e.classList.add("hit");

      popup("-"+dmg);

      text += "Siz urdingiz -" + dmg + " HP<br>";
    }
  }

  // ENEMY
  if(enemyAction === "attack"){

    e.classList.add("attackE");

    enemyST -= 15;

    if(action === "block"){

      p.classList.add("block");

      text += "Siz himoyalandingiz<br>";

    }else{

      let dmg =
        Math.floor(Math.random()*15)+10;

      if(enemyST < 30){
        dmg -= 5;
      }

      playerHP -= dmg;

      p.classList.add("hit");

      text += "Bot sizni urdi -" + dmg + " HP";
    }
  }

  playerHP = Math.max(0,playerHP);
  enemyHP = Math.max(0,enemyHP);

  playerST += 5;
  enemyST += 5;

  if(playerST > 100) playerST = 100;
  if(enemyST > 100) enemyST = 100;

  updateUI();

  document.getElementById("log").innerHTML = text;

  if(playerHP <= 0){

    setTimeout(()=>{
      alert("Siz yutqazdingiz 😢");
      location.reload();
    },500);

  }

  if(enemyHP <= 0){

    setTimeout(()=>{
      alert("Siz yutdingiz 🏆");
      location.reload();
    },500);

  }

  setTimeout(()=>{
    busy = false;
  },500);
}

updateUI();

</script>

</body>
</html>
```
