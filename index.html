<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boks Chempionati - Realistik Jang</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Arial', sans-serif; background: #06060c; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  #app { width: 100%; max-width: 480px; background: #11111e; border: 2px solid #22223b; border-radius: 24px; padding: 1.2rem; box-shadow: 0 15px 35px rgba(0,0,0,0.7); overflow: hidden; }
  
  .screen { display: none; }
  .screen.active { display: block; }
  
  /* Menu */
  .logo h1 { font-size: 2.8rem; color: #e74c3c; text-shadow: 0 0 10px rgba(231, 76, 60, 0.4); margin-top: 1rem; }
  .logo p { color: #777; margin-bottom: 2rem; font-size: 0.95rem; }
  .menu-box { background: #161629; border: 1px solid #2a2a44; border-radius: 16px; padding: 1.5rem; }
  .mode-select { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 1.5rem 0; }
  .m-btn { background: #0b0b14; border: 2px solid #2a2a44; border-radius: 12px; padding: 1.2rem 1rem; cursor: pointer; color: #aaa; font-weight: bold; transition: all 0.2s; }
  .m-btn.sel { border-color: #e74c3c; background: #2c161d; color: #fff; box-shadow: 0 0 12px rgba(231, 76, 60, 0.2); }
  .start-btn { width: 100%; padding: 16px; background: #e74c3c; border: none; border-radius: 12px; color: #fff; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  
  /* Game UI */
  .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .round { background: #22223b; padding: 4px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; color: #f1c40f; }
  
  /* Status Bars */
  .fighters-status { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 1rem; }
  .status-card { background: #161629; border: 1px solid #2a2a44; border-radius: 12px; padding: 0.8rem; text-align: left; }
  .name { font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; color: #ddd; }
  
  /* HP and Stamina Bars */
  .bar-label { font-size: 0.65rem; color: #888; margin-top: 4px; display: flex; justify-content: space-between; }
  .bar-bg { background: #090910; border-radius: 4px; height: 10px; overflow: hidden; margin-bottom: 4px; border: 1px solid #222; }
  .fill { height: 100%; width: 100%; transition: width 0.25s ease-out; }
  .hp-p { background: linear-gradient(90deg, #2ecc71, #27ae60); }
  .hp-e { background: linear-gradient(90deg, #e74c3c, #c0392b); }
  .stamina-fill { background: linear-gradient(90deg, #3498db, #2980b9); }

  /* REALISTIC RING */
  .ring { background: linear-gradient(to bottom, #111122 0%, #1c1c32 100%); border: 4px solid #333; border-bottom: 8px solid #555; border-radius: 16px; height: 180px; position: relative; margin-bottom: 1rem; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 40px 10px; overflow: hidden; }
  /* Ring Arqonlari */
  .ring::before { content: ''; position: absolute; left: 0; right: 0; top: 40px; height: 4px; background: #e74c3c; opacity: 0.7; box-shadow: 0 40px 0 #fff, 0 80px 0 #3498db; }
  
  /* Boxer Siluetlari */
  .boxer { width: 70px; height: 110px; background-size: contain; background-repeat: no-repeat; background-position: bottom; position: relative; transition: all 0.2s ease; }
  #p-boxer { background-image: url('https://icons8.com'); filter: drop-shadow(0 0 8px #2ecc71); }
  #e-boxer { background-image: url('https://icons8.com'); transform: scaleX(-1); filter: drop-shadow(0 0 8px #e74c3c); }
  
  /* Anims */
  .att-p { animation: attP 0.25s ease; }
  .att-e { animation: attE 0.25s ease; }
  .hit-shake { animation: shake 0.2s ease; filter: brightness(2) saturate(3) !important; }
  .block-state { transform: scale(0.9) translateY(5px) !important; opacity: 0.6; }

  @keyframes attP { 0%{ transform: translateX(0); } 50%{ transform: translateX(50px) scale(1.1); } 100%{ transform: translateX(0); } }
  @keyframes attE { 0%{ transform: scaleX(-1) translateX(0); } 50%{ transform: scaleX(-1) translateX(50px) scale(1.1); } 100%{ transform: scaleX(-1) translateX(0); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

  /* Damage FX Popup */
  .damage-txt { position: absolute; top: 40px; font-size: 1.5rem; font-weight: 900; color: #f1c40f; animation: floatUp 0.4s ease-out forwards; display: none; text-shadow: 0 2px 4px #000; }
  @keyframes floatUp { 0% { transform: translateY(0) scale(0.7); opacity: 1; } 100% { transform: translateY(-30px) scale(1.3); opacity: 0; } }

  /* Controls */
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
  .ctrl-btn { padding: 16px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; color: #fff; cursor: pointer; transition: background 0.1s; }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-atk { background: #e74c3c; }
  .btn-def { background: #3498db; }
  
  /* Log output */
  .referee-log { background: #090910; border: 1px solid #222; border-radius: 10px; padding: 0.8rem; font-size: 0.85rem; height: 65px; overflow-y: auto; text-align: left; color: #ccc; font-style: italic; }
  .quit { background: none; border: none; color: #555; cursor: pointer; font-size: 0.85rem; margin-top: 10px; font-weight: bold; text-decoration: underline; }
</style>
</head>
<body>
<div id="app">

  <!-- 1. BOSH MENYU -->
  <div id="s-menu" class="screen active">
    <div class="logo">
      <h1>BOXING CHAMP</h1>
      <p>Professional Taktik Boks Simulyatori</p>
    </div>
    <div class="menu-box">
      <span style="font-size:0.9rem; color:#888;">RAQIB TOIFASI:</span>
      <div class="mode-select">
        <button class="m-btn sel" id="m-bot" onclick="changeMode('bot')">🤖 VS BOT<br><small style="font-weight:normal; font-size:0.7rem;">Mashg'ulot</small></button>
        <button class="m-btn" id="m-pvp" onclick="changeMode('pvp')">🥷 VS ODAM<br><small style="font-weight:normal; font-size:0.7rem;">Onlayn Sparring</small></button>
      </div>
      <button class="start-btn" onclick="startFight()">Ringga chiqish 🥊</button>
    </div>
  </div>

  <!-- 2. JANG EKRANI -->
  <div id="s-game" class="screen">
    <div class="hud">
      <span id="game-type" style="font-size:0.8rem; font-weight:bold; color:#888;">PROFESSIONAL MATCH</span>
      <span class="round">RAUND 1</span>
    </div>
    
    <!-- STATUSLAR -->
    <div class="fighters-status">
      <!-- Player -->
      <div class="status-card">
        <div class="name">Siz (KIRKLAND)</div>
        <div class="bar-bg"><div id="p-hp" class="fill hp-p"></div></div>
        <div class="bar-bg" style="height:6px;"><div id="p-stamina" class="fill stamina-fill"></div></div>
        <div class="bar-label"><span>HP</span><span id="p-st-num">STAMINA: 100%</span></div>
      </div>
      <div style="font-weight:bold; color:#444;">VS</div>
      <!-- Enemy -->
      <div class="status-card">
        <div id="e-name" class="name">Raqib (TAISON)</div>
        <div class="bar-bg"><div id="e-hp" class="fill hp-e"></div></div>
        <div class="bar-bg" style="height:6px;"><div id="e-stamina" class="fill stamina-fill"></div></div>
        <div class="bar-label"><span>HP</span><span id="e-st-num">STAMINA: 100%</span></div>
      </div>
    </div>

    <!-- REAL RING ARENA -->
    <div class="ring">
      <div id="pop-fx" class="damage-txt">💥 -20 HP</div>
      <div id="p-boxer" class="boxer"></div>
      <div id="e-boxer" class="boxer"></div>
    </div>

    <!-- REAL JANG TUGMALARI -->
    <div class="controls">
      <button id="btn-punch" class="ctrl-btn btn-atk" onclick="executeAction('punch')">🥊 JAB / ZARBA</button>
      <button id="btn-block" class="ctrl-btn btn-def" onclick="executeAction('block')">🛡️ BLOK / HIMOYALANISH</button>
    </div>

    <!-- REFEREE LOG -->
    <div id="log-text" class="referee-log">
      Smit referi: "Faqat toza jang bo'lsin! Box!"
    </div>
    
    <button class="quit" onclick="exitToMenu()">Ringdan qochish (Chiqish)</button>
  </div>

</div>

<script>
  let mode = 'bot';
  let pHP = 100, pStamina = 100;
  let eHP = 100, eStamina = 100;
  let isActionRunning = false;

  function changeMode(m) {
    mode = m;
    document.getElementById('m-bot').classList.remove('sel');
    document.getElementById('m-pvp').classList.remove('sel');
    document.getElementById('m-'+m).classList.add('sel');
  }

  function startFight() {
    pHP = 100; pStamina = 100;
    eHP = 100; eStamina = 100;
    isActionRunning = false;
    
    document.getElementById('e-name').innerText = mode === 'pvp' ? 'Odam (CHEVChENKO)' : 'Raqib (BOT TAISON)';
    document.getElementById('game-type').innerText = mode === 'pvp' ? 'LIVE MULTIPLAYER' : 'SINGLE TRAINING';
    
    updateUIBars();
    document.getElementById('log-text').innerHTML = 'Smit referi: "Gong chalindi! Jang boshlandi!"';
    
    document.getElementById('s-menu').classList.remove('active');
    document.getElementById('s-game').classList.add('active');
  }

  function exitToMenu() {
    document.getElementById('s-game').classList.remove('active');
    document.getElementById('s-menu').classList.add('active');
  }

  function triggerPopup(text, leftPos) {
    let fx = document.getElementById('pop-fx');
    fx.innerText = text;
    fx.style.left = leftPos + 'px';
    fx.style.display = 'block';
    setTimeout(() => fx.style.display = 'none', 400);
  }

  function executeAction(pChoice) {
    if (isActionRunning || pHP <= 0 || eHP <= 0) return;
    isActionRunning = true;

    // Bot qarori (Taktik: agar staminasi kam bo'lsa ko'proq blok tanlaydi)
    let eChoice = 'punch';
    if (eStamina < 30) {
